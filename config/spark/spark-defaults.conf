# config/spark/spark-defaults.conf
# Configuración Spark para el Distributed Lab
# Reutilizada de spark_ML con ajustes para el Data Lakehouse

spark.master                            spark://spark-master:7077
spark.eventLog.enabled                  true
spark.eventLog.dir                      /opt/spark/spark-events        # apache/spark — NO /opt/bitnami

# Limitar los cores por aplicación para evitar deadlocks en el Notebook
spark.cores.max                         2

# SQL / Hive
spark.sql.warehouse.dir                 /opt/spark/warehouse
spark.sql.hive.metastore.version        3.1.3
spark.sql.hive.metastore.jars           path
spark.sql.hive.metastore.jars.path      /opt/external-jars/mysql-connector-j.jar

# Parquet
spark.sql.parquet.compression.codec     snappy
spark.sql.parquet.mergeSchema           false
spark.hadoop.parquet.enable.summary-metadata false

# AQE (Adaptive Query Execution)
spark.sql.adaptive.enabled              true
spark.sql.adaptive.coalescePartitions.enabled true
spark.sql.adaptive.skewJoin.enabled     true

# MLflow
spark.mlflow.trackingUri                http://mlflow:5000

# Serialización
spark.serializer                        org.apache.spark.serializer.KryoSerializer

# External JARs
spark.driver.extraClassPath             /opt/external-jars/mysql-connector-j.jar
spark.executor.extraClassPath           /opt/external-jars/mysql-connector-j.jar
